<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | volvevent</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:;">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css?v=3.0">
    <script src="main.js" defer></script>
</head>
<body class="font-sans antialiased">

    <nav class="border-b border-slate-800 bg-slate-950/90 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold tracking-widest text-slate-100 uppercase">
                VOLVE<span class="text-cyan-400">VENT</span>
            </a>
            <div class="hidden md:flex gap-8 text-sm font-mono tracking-widest text-slate-400">
                <a href="index.html" class="hover:text-cyan-400 transition-colors">HOME</a>
                <a href="index.html" class="hover:text-cyan-400 transition-colors">Services</a>
                <a href="about.html" class="hover:text-cyan-400 transition-colors">ARCHITECT</a>
                <a href="contact.html" class="text-cyan-400">CONTACT</a>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 py-20">
        <div class="text-center mb-16">
            <h1 class="text-4xl font-bold text-slate-100 mb-4">Establish Secure Channel</h1>
            <p class="text-slate-400">Kontaktieren Sie uns für eine System-Evaluation. Sämtliche Anfragen werden diskret und professionell behandelt.</p>
        </div>

        <div class="glass-panel rounded-xl p-8 border border-slate-700">
            <form action="#" class="space-y-6" onsubmit="event.preventDefault(); alert('Security Check: Data sanitized and prepared for encrypted transmission. (Demo)');">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-mono text-slate-400 uppercase mb-2">Name</label>
                        <input type="text" required class="w-full bg-slate-900 border border-slate-700 rounded-md px-4 py-3 text-slate-200 focus:outline-none focus:border-cyan-500 transition-colors">
                    </div>
                    <div>
                        <label class="block text-xs font-mono text-slate-400 uppercase mb-2">Email</label>
                        <input type="email" required class="w-full bg-slate-900 border border-slate-700 rounded-md px-4 py-3 text-slate-200 focus:outline-none focus:border-cyan-500 transition-colors">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-mono text-slate-400 uppercase mb-2">Transmission Data (Message)</label>
                    <textarea rows="5" required class="w-full bg-slate-900 border border-slate-700 rounded-md px-4 py-3 text-slate-200 focus:outline-none focus:border-cyan-500 transition-colors resize-none"></textarea>
                </div>
                <div class="pt-4 flex justify-end">
                    <button type="submit" class="glow-btn px-8 py-3 rounded border border-slate-600 text-sm font-mono uppercase tracking-widest text-slate-200">
                        Transmit Data
                    </button>
                </div>
            </form>
        </div>
        
        <div class="mt-16 text-center font-mono text-sm text-slate-500">
            <p>HQ: Ergolding, Germany</p>
            <p class="mt-2 text-cyan-400">kontakt@volvevent.de</p>
        </div>
    </main>
</body>
</html>
